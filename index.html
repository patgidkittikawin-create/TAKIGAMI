<script>
  // 1. ระบุ URL API Web App ของคุณ
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySpAm5vZD9oIjTRIq94xKAT6WyuSQhdcVkjBCVzhpzPOoNIvp1uZyj9n2e8N8pM_4E/exec";

  let catalogData = [];
  let cart = {};

  // 2. ฟังก์ชันดึงข้อมูลจาก Google Sheets (JSONP)
  function fetchCatalog() {
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?action=getCatalog&callback=onCatalogLoaded`;
    document.body.appendChild(script);
  }

  // 3. เมื่อดึงข้อมูลสำเร็จ ให้บันทึกและแสดงผลรายการ
  function onCatalogLoaded(response) {
    if (response && response.success) {
      catalogData = response.data;
      renderCatalog(catalogData);
    } else {
      console.error("ไม่สามารถดึงข้อมูลสินค้าได้");
    }
  }

  // 4. ฟังก์ชันแสดงผลการ์ดสินค้า
  function renderCatalog(items) {
    const container = document.getElementById('catalogContainer'); // เช็ก ID ให้ตรงกับ Container ใน HTML
    if (!container) return;

    if (!items || items.length === 0) {
      container.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500">ไม่พบรายการสินค้า</div>`;
      return;
    }

    container.innerHTML = items.map(item => {
      const selectedQty = cart[item.partId] || 0;
      const remainingStock = item.stock - selectedQty;

      return `
        <div class="card p-4 border border-gray-100 rounded-2xl bg-white shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold text-gray-400">${item.partId}</span>
              <span id="stock-${item.partId}" class="badge bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full text-xs font-bold">
                คลัง: ${remainingStock}
              </span>
            </div>
            <h3 class="font-bold text-gray-800 text-sm mb-1">${item.partName}</h3>
            <p class="text-xs text-gray-500 mb-1">ขนาด: ${item.size}</p>
            <p class="text-xs text-red-500 font-medium mb-3">📍 ${item.location}</p>
          </div>

          <div class="flex items-center justify-between bg-gray-50 p-1.5 rounded-xl border border-gray-100">
            <button type="button" onclick="changeQty('${item.partId}', -1)" class="w-9 h-9 flex items-center justify-center bg-white rounded-lg font-bold text-gray-600 shadow-sm border border-gray-100 active:scale-95">-</button>
            <span id="qty-${item.partId}" class="font-bold text-gray-800 text-base">${selectedQty}</span>
            <button type="button" onclick="changeQty('${item.partId}', 1)" class="w-9 h-9 flex items-center justify-center bg-amber-400 hover:bg-amber-500 rounded-lg font-bold text-gray-900 shadow-sm active:scale-95">+</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // 5. ฟังก์ชันกด +/- ปรับตัวเลขและคลังคงเหลือแบบ Real-time
  function changeQty(partId, delta) {
    const item = catalogData.find(p => p.partId === partId);
    if (!item) return;

    const currentQty = cart[partId] || 0;
    const newQty = currentQty + delta;

    if (newQty < 0) return;
    if (newQty > item.stock) {
      alert(`สินค้าในคลังมีเพียง ${item.stock} ชิ้นเท่านั้น`);
      return;
    }

    if (newQty === 0) {
      delete cart[partId];
    } else {
      cart[partId] = newQty;
    }

    const qtyElem = document.getElementById(`qty-${partId}`);
    if (qtyElem) qtyElem.innerText = newQty;

    const stockElem = document.getElementById(`stock-${partId}`);
    if (stockElem) {
      stockElem.innerText = `คลัง: ${item.stock - newQty}`;
    }

    if (typeof updateCartBadge === 'function') updateCartBadge();
  }

  // เรียกดึงข้อมูลสินค้าอัตโนมัติเมื่อเปิดหน้าเว็บ
  document.addEventListener("DOMContentLoaded", fetchCatalog);
</script>
