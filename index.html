<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAKIGAMI Store - ระบบเบิกอุปกรณ์สหกิจ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">🔧 TAKIGAMI Store</h1>
            <p class="text-indigo-200 text-sm mt-1 md:mt-0">ระบบเบิกอุปกรณ์และเครื่องมือโปรเจคสหกิจ</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Catalog Section (Left 2 columns) -->
        <div class="lg:col-span-2 space-y-4">
            <!-- Search & Filter Bar -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-3">
                <input type="text" id="searchInput" placeholder="🔍 ค้นหาด้วยชื่อสินค้า, ขนาด, หรือรหัส Code..." 
                    class="flex-grow px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <select id="categorySelect" class="px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">📁 ทุกหมวดหมู่</option>
                </select>
            </div>

            <!-- Product Grid -->
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[70vh] overflow-y-auto p-1">
                <div class="col-span-2 text-center py-12 text-slate-400">กำลังโหลดรายการอุปกรณ์...</div>
            </div>
        </div>

        <!-- Cart & Requisition Form Section (Right 1 column) -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col h-fit sticky top-6">
            <h2 class="text-lg font-bold text-slate-900 mb-3 border-b pb-2">🛒 รายการที่เลือกเบิก</h2>
            
            <!-- Cart Items List -->
            <div id="cartList" class="divide-y divide-slate-100 max-h-48 overflow-y-auto mb-4 text-sm">
                <p class="text-slate-400 text-center py-6">ยังไม่มีสินค้าในตะกร้า</p>
            </div>

            <!-- Requisition Form Inputs -->
            <form id="requisitionForm" class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">ชื่อ-นามสกุลผู้เบิก</label>
                    <input type="text" id="userName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">แผนก / สาขา</label>
                        <input type="text" id="userDept" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">โปรเจค / งาน</label>
                        <input type="text" id="userProject" required value="โปรเจคสหกิจ" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">วัตถุประสงค์การใช้งาน</label>
                    <textarea id="userPurpose" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                    ยืนยันการเบิกอุปกรณ์
                </button>
            </form>
        </div>

    </main>

    <!-- Script Application Logic -->
    <script>
        // กำหนด Web App URL ที่เชื่อมต่อกับ Google Apps Script แล้ว
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8r8_ThzddfepI5t1TamQoHSy-bbTyueGC9lcCTUKzEzGtwxBZNZBkeqBtq1fHZyxY/exec"; 

        let catalogData = [];
        let cart = [];

        // โหลดข้อมูลสินค้าจาก Google Sheets
        function fetchCatalog() {
            const script = document.createElement('script');
            script.src = `${WEB_APP_URL}?action=getCatalog&callback=handleCatalogResponse`;
            document.body.appendChild(script);
        }

        function handleCatalogResponse(response) {
            if (response.success) {
                catalogData = response.data;
                initCategories();
                renderProducts(catalogData);
            } else {
                document.getElementById('productGrid').innerHTML = `<div class="col-span-2 text-center text-red-500 py-8">โหลดข้อมูลไม่สำเร็จ: ${response.error}</div>`;
            }
        }

        function initCategories() {
            const select = document.getElementById('categorySelect');
            // ล้างตัวเลือกเก่าก่อนเพิ่มใหม่เพื่อป้องกันรายการซ้ำซ้อน
            select.innerHTML = '<option value="all">📁 ทุกหมวดหมู่</option>';
            const categories = [...new Set(catalogData.map(item => item.category))];
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center text-slate-400 py-12">ไม่พบรายการอุปกรณ์ที่ค้นหา</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="bg-white border border-slate-200 rounded-xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition">
                    <div>
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded">${item.partId}</span>
                            <span class="text-xs text-slate-500">สต็อก: <strong class="${item.stock > 0 ? 'text-emerald-600' : 'text-red-600'}">${item.stock}</strong></span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base mt-1">${item.partName}</h3>
                        <p class="text-xs text-slate-500 mb-1">ขนาด: <span class="text-slate-700 font-medium">${item.size || '-'}</span></p>
                        <p class="text-[11px] text-slate-400 truncate">${item.category}</p>
                    </div>
                    <div class="mt-4 flex items-center justify-between">
                        <span class="text-xs text-slate-500">ตำแหน่ง: ${item.location}</span>
                        <button onclick="addToCart('${item.partId}')" ${item.stock <= 0 ? 'disabled' : ''} 
                            class="px-3 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white text-xs font-semibold rounded-lg transition disabled:bg-slate-100 disabled:text-slate-400">
                            + เลือกเบิก
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ระบบตะกร้าสินค้า
        function addToCart(partId) {
            const product = catalogData.find(p => p.partId === partId);
            if (!product) return;

            const existing = cart.find(item => item.partId === partId);
            if (existing) {
                if (existing.qty < product.stock) {
                    existing.qty++;
                } else {
                    alert('จำนวนที่ต้องการเบิกเกินสต็อกที่มีอยู่ครับ');
                }
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function updateQty(partId, delta) {
            const item = cart.find(i => i.partId === partId);
            if (!item) return;
            const product = catalogData.find(p => p.partId === partId);
            
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.partId !== partId);
            } else if (item.qty > product.stock) {
                item.qty = product.stock;
                alert('จำนวนเกินสต็อกคงเหลือ');
            }
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            if (cart.length === 0) {
                list.innerHTML = `<p class="text-slate-400 text-center py-6">ยังไม่มีสินค้าในตะกร้า</p>`;
                return;
            }

            list.innerHTML = cart.map(item => `
                <div class="py-2 flex justify-between items-center text-xs">
                    <div class="truncate pr-2">
                        <p class="font-semibold text-slate-800">${item.partName} (${item.size})</p>
                        <span class="text-slate-400 font-mono">${item.partId}</span>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button type="button" onclick="updateQty('${item.partId}', -1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded font-bold">-</button>
                        <span class="w-6 text-center font-semibold">${item.qty}</span>
                        <button type="button" onclick="updateQty('${item.partId}', 1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded font-bold">+</button>
                    </div>
                </div>
            `).join('');
        }

        // ค้นหาแบบ Real-time
        function filterProducts() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedCat = document.getElementById('categorySelect').value;

            const filtered = catalogData.filter(item => {
                const matchKeyword = item.partName.toLowerCase().includes(keyword) || 
                                     item.partId.toLowerCase().includes(keyword) || 
                                     item.size.toLowerCase().includes(keyword);
                const matchCat = (selectedCat === 'all' || item.category === selectedCat);
                return matchKeyword && matchCat;
            });
            renderProducts(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterProducts);
        document.getElementById('categorySelect').addEventListener('change', filterProducts);

        // ส่งฟอร์มเบิกอุปกรณ์ไป Backend
        document.getElementById('requisitionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert('กรุณาเลือกสินค้าอย่างน้อย 1 รายการก่อนทำการเบิกครับ');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'กำลังบันทึกข้อมูล...';

            const formData = {
                orderId: 'REQ-' + Date.now().toString().slice(-6),
                userName: document.getElementById('userName').value,
                dept: document.getElementById('userDept').value,
                project: document.getElementById('userProject').value,
                purpose: document.getElementById('userPurpose').value,
                pickupType: 'มารับเอง',
                timeSlot: 'ปกติ',
                cart: cart
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'submitForm', formData: formData })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    alert('✅ เบิกอุปกรณ์สำเร็จ! ระบบได้บันทึกประวัติและตัดสต็อกเรียบร้อยแล้ว');
                    cart = [];
                    renderCart();
                    document.getElementById('requisitionForm').reset();
                    fetchCatalog(); // รีเฟรชข้อมูลสต็อกล่าสุด
                } else {
                    alert('เกิดข้อผิดพลาด: ' + res.error);
                }
            })
            .catch(err => {
                alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้: ' + err.message);
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'ยืนยันการเบิกอุปกรณ์';
            });
        });

        // เริ่มต้นโหลดข้อมูลเมื่อเปิดเว็บ
        fetchCatalog();
    </script>
</body>
</html>
