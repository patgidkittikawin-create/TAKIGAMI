<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TAKIGAMI (TTC) - Store Requisition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <style>
    :root { 
      --ttc-primary: #1B2188; 
      --ttc-bg: #F0F4F8; 
      --ttc-border: #E2E8F0;
    }
    body { 
      font-family: 'Kanit', sans-serif; 
      background-color: var(--ttc-bg); 
      padding-bottom: 90px;
    }

    .main-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .section-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--ttc-border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .section-title {
      color: var(--ttc-primary);
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Part Card Design */
    .part-item {
      background: #ffffff;
      padding: 14px 16px;
      border-bottom: 1px solid #EDF2F7;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .part-item:last-child {
      border-bottom: none;
    }

    .part-info {
      flex-grow: 1;
      padding-right: 12px;
    }

    .part-title-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .part-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #1A202C;
    }

    .part-id-badge {
      background-color: #718096;
      color: white;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-block;
    }

    .part-subtext {
      font-size: 0.85rem;
      color: #718096;
    }

    /* Action Buttons */
    .btn-select-part {
      border: 1.5px solid #3182CE;
      color: #3182CE;
      background: white;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-select-part:hover {
      background: #EBF8FF;
    }

    .qty-counter {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qty {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #CBD5E0;
      background: #EDF2F7;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-qty:active {
      background: #E2E8F0;
    }

    .qty-val {
      font-weight: 700;
      font-size: 1rem;
      color: var(--ttc-primary);
      min-width: 20px;
      text-align: center;
    }

    /* Form Controls */
    .form-control-custom, .form-select-custom {
      border-radius: 8px;
      padding: 12px 14px;
      border: 1px solid #CBD5E1;
      font-size: 0.95rem;
    }
    .form-control-custom::placeholder {
      color: #A0AEC0;
    }

    /* Fixed Bottom Button */
    .fixed-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--ttc-primary);
      padding: 14px;
      z-index: 1040;
    }

    .btn-submit-main {
      width: 100%;
      background: transparent;
      color: white;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <form id="requisitionForm" onsubmit="handleFormSubmit(event)">
      
      <!-- 1. รายการสินค้า -->
      <div class="section-card p-0" style="overflow: hidden;">
        <div id="loadingSpinner" class="text-center py-4">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="small text-muted mt-2">กำลังโหลดข้อมูลรายการสินค้า...</p>
        </div>
        <div id="catalogContainer"></div>
      </div>

      <!-- 2. ข้อมูลผู้เบิก -->
      <div class="section-card">
        <div class="section-title">
          <i class="fa-solid fa-id-card"></i> 2. ข้อมูลผู้เบิก
        </div>

        <div class="mb-3">
          <input type="text" id="userName" class="form-control form-control-custom" placeholder="ชื่อ-นามสกุล ผู้เบิก" required>
        </div>

        <div class="mb-3">
          <select id="department" class="form-select form-select-custom" required>
            <option value="" disabled selected>-- เลือกแผนก --</option>
            <option value="Electrical">Electrical</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Machine Assembly">Machine Assembly</option>
            <option value="Production">Production</option>
            <option value="Quality Control">Quality Control</option>
          </select>
        </div>

        <div class="mb-1">
          <input type="text" id="projectJobId" class="form-control form-control-custom" placeholder="รหัส Job / Project ID" required>
        </div>
      </div>

      <!-- Fixed Bottom Submit -->
      <div class="fixed-bottom-bar text-center">
        <button type="submit" class="btn-submit-main">
          ส่งคำขอเบิกสินค้า
        </button>
      </div>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFErgGRvsSxsnqxBRjUmkp8FFHCso5u3ltNLUuJTAL6nlezjq7GSlSc2nRtd95SYpo/exec"; 
    let selectedCart = {};
    let globalCatalogData = [];

    document.addEventListener("DOMContentLoaded", loadCatalogJSONP);

    function loadCatalogJSONP() {
      const script = document.createElement('script');
      script.src = `${GAS_WEB_APP_URL}?action=getCatalog&callback=onCatalogLoaded`;
      document.body.appendChild(script);
    }

    function onCatalogLoaded(res) {
      document.getElementById("loadingSpinner").style.display = "none";
      if (res && res.success) {
        globalCatalogData = res.data;
        renderCatalog(globalCatalogData);
      } else {
        document.getElementById("catalogContainer").innerHTML = "<p class='text-danger text-center py-3'>ไม่สามารถดึงข้อมูลรายการสินค้าได้</p>";
      }
    }

    function renderCatalog(data) {
      const container = document.getElementById("catalogContainer");
      container.innerHTML = "";
      
      data.forEach(item => {
        const qty = selectedCart[item.partId] || 0;
        
        let actionUI = `
          <button type="button" class="btn-select-part" onclick="updateQty('${item.partId}', 1, ${item.qtyStock})">
            + เลือก
          </button>
        `;

        if (qty > 0) {
          actionUI = `
            <div class="qty-counter">
              <button type="button" class="btn-qty" onclick="updateQty('${item.partId}', -1, ${item.qtyStock})">-</button>
              <span class="qty-val">${qty}</span>
              <button type="button" class="btn-qty" onclick="updateQty('${item.partId}', 1, ${item.qtyStock})">+</button>
            </div>
          `;
        }

        container.innerHTML += `
          <div class="part-item">
            <div class="part-info">
              <div class="part-title-container">
                <span class="part-name">${item.partName}</span>
                <span class="part-id-badge">${item.partId}</span>
              </div>
              <div class="part-subtext">คงเหลือ: ${item.qtyStock}</div>
              ${item.location ? `<div class="part-subtext">ตำแหน่ง: ${item.location}</div>` : ''}
            </div>
            <div>${actionUI}</div>
          </div>
        `;
      });
    }

    function updateQty(partId, change, maxStock) {
      const current = selectedCart[partId] || 0;
      const next = current + change;
      
      if (next < 0) return;
      if (next > maxStock) {
        Swal.fire('แจ้งเตือน', 'จำนวนเบิกเกินสต็อกที่มีอยู่ในคลัง', 'warning');
        return;
      }
      
      if (next === 0) {
        delete selectedCart[partId];
      } else {
        selectedCart[partId] = next;
      }
      
      // อัปเดตหน้าจอทันทีจาก Memory
      renderCatalog(globalCatalogData);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const itemsToSubmit = Object.keys(selectedCart).map(id => ({ partId: id, qty: selectedCart[id] }));
      
      if (itemsToSubmit.length === 0) {
        Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายการสินค้าอย่างน้อย 1 ชิ้น', 'warning');
        return;
      }

      Swal.fire({
        title: 'กำลังส่งข้อมูล...',
        text: 'กรุณารอสักครู่ ระบบกำลังบันทึกคำขอเบิกสินค้า',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
          action: "submitForm",
          formData: {
            userName: document.getElementById("userName").value,
            department: document.getElementById("department").value,
            projectJobId: document.getElementById("projectJobId").value,
            items: itemsToSubmit
          }
        })
      }).then(() => {
        Swal.fire({
          icon: 'success',
          title: 'ส่งคำขอเบิกเรียบร้อย!',
          text: 'ระบบได้บันทึกข้อมูลและตัดสต็อกสินค้าแล้ว',
          confirmButtonColor: '#1B2188'
        }).then(() => {
          location.reload();
        });
      });
    }
  </script>
</body>
</html>
