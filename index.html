<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TAKIGAMI (TTC) - Store Requisition System</title>

  <!-- ตั้งค่า PWA สำหรับ iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="เบิกสินค้า TTC">
  <meta name="application-name" content="เบิกสินค้า TTC">
  <meta name="theme-color" content="#1D2088">

  <!-- รูปไอคอนแอป -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://cdn-icons-png.flaticon.com/512/2897/2897785.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn-icons-png.flaticon.com/512/2897/2897785.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

  <style>
    :root { --ttc-primary: #1D2088; --ttc-accent: #E6B400; --ttc-bg: #F4F6F9; }
    body { font-family: 'Kanit', sans-serif; background-color: var(--ttc-bg); padding-bottom: 95px; }
    .top-bar { background-color: var(--ttc-primary); color: #fff; padding: 14px 16px; border-bottom: 4px solid var(--ttc-accent); }
    .card { border-radius: 14px; margin-bottom: 18px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .fixed-bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px 16px; z-index: 1040; border-top: 1px solid #eee; }
    .btn-submit { height: 50px; font-size: 1.1rem; font-weight: 600; background-color: var(--ttc-primary); color: #fff; border-radius: 12px; border: none; }
  </style>
</head>
<body>

  <div class="top-bar text-center">
    <h1 class="fs-5 fw-bold text-uppercase m-0">TAKIGAMI (TTC) - Store Requisition</h1>
    <p class="small m-0 opacity-75">ระบบเบิกจ่ายวัสดุ อุปกรณ์ และพาร์ท</p>
  </div>

  <div class="container px-3 mt-3">
    <form id="requisitionForm" onsubmit="handleFormSubmit(event)">
      <div class="card p-3">
        <h6 class="fw-bold mb-3" style="color: var(--ttc-primary);"><i class="fa-solid fa-boxes-stacked me-2"></i>1. รายการสินค้า</h6>
        <div id="loadingSpinner" class="text-center py-3">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="small text-muted mt-2">กำลังโหลดข้อมูลสินค้า...</p>
        </div>
        <div id="catalogList"></div>
      </div>

      <div class="card p-3">
        <h6 class="fw-bold mb-3" style="color: var(--ttc-primary);"><i class="fa-solid fa-id-card me-2"></i>2. ข้อมูลผู้เบิก</h6>
        <input type="text" id="userName" class="form-control mb-2" required placeholder="ชื่อ-นามสกุล ผู้เบิก">
        <select id="department" class="form-select mb-2" required>
          <option value="" disabled selected>-- เลือกแผนก --</option>
          <option value="Electrical">Electrical</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Machine Assembly">Machine Assembly</option>
        </select>
        <input type="text" id="projectJobId" class="form-control" required placeholder="รหัส Job / Project ID">
      </div>

      <div class="fixed-bottom-bar">
        <button type="submit" class="btn btn-submit w-100">ส่งคำขอเบิกสินค้า</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // 🔗 วาง Web App URL ที่เพิ่งส่งมาให้พี่ลงในเครื่องหมายคำพูดด้านล่าง
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZdxGFs4rnsNeHZw8b0Feigp0OdTl4pzIggXYrJyfG7nnEw4IyXsq5fz3vT3GgyScX/exec"; 

    let catalogData = [];
    let selectedCart = {};

    document.addEventListener("DOMContentLoaded", loadCatalog);

    function loadCatalog() {
      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getCatalog" })
      })
      .then(res => res.json())
      .then(res => {
        document.getElementById("loadingSpinner").style.display = "none";
        if (res.success) {
          catalogData = res.data;
          renderCatalog(res.data);
        }
      });
    }

    function renderCatalog(data) {
      const container = document.getElementById("catalogList");
      container.innerHTML = "";
      data.forEach(item => {
        container.innerHTML += `
          <div class="d-flex justify-content-between align-items-center border-bottom py-2">
            <div>
              <strong>${item.partName}</strong> <span class="badge bg-secondary">${item.partId}</span>
              <div class="small text-muted">คงเหลือ: ${item.qtyStock}</div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="updateQty('${item.partId}', 1)">+ เลือก</button>
          </div>
        `;
      });
    }

    function updateQty(partId, change) {
      selectedCart[partId] = (selectedCart[partId] || 0) + change;
      Swal.fire({ icon: 'success', title: 'เพิ่มลงรายการแล้ว', timer: 700, showConfirmButton: false });
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const itemsToSubmit = Object.keys(selectedCart).map(id => ({ partId: id, qty: selectedCart[id] }));
      
      if (itemsToSubmit.length === 0) {
        Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายการสินค้าอย่างน้อย 1 ชิ้น', 'warning');
        return;
      }

      const payload = {
        action: "submitForm",
        formData: {
          userName: document.getElementById("userName").value,
          department: document.getElementById("department").value,
          projectJobId: document.getElementById("projectJobId").value,
          items: itemsToSubmit
        }
      };

      Swal.showLoading();
      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          Swal.fire('สำเร็จ!', 'บันทึกการเบิกเรียบร้อย', 'success').then(() => location.reload());
        }
      });
    }
  </script>
</body>
</html>
