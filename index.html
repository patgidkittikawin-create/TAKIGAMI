<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // 📌 นำลิงก์ Web App ของคุณมาใส่ไว้ที่ตัวแปรนี้ครับ
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFS8OKXmvWZiI9aHYizULTwCVmNIAoCQ2ZSiE5jLUh2cBkuEBpBoE8BymEB_3dgRr3/exec";
    
    let catalog = [], cart = {};
    let currentStep = 1;
    let selectedMainCategory = null;
    let selectedSubCategory = null;

    document.addEventListener("DOMContentLoaded", () => {
      loadCatalogJSONP();
    });

    function loadCatalogJSONP() {
      const script = document.createElement('script');
      script.src = `${GAS_WEB_APP_URL}?action=getCatalog&callback=onCatalogLoaded`;
      
      const timeout = setTimeout(() => {
        document.getElementById('step1Container').innerHTML = `
          <div class="text-danger py-3 text-center col-12">
            <i class="fa-solid fa-triangle-exclamation fa-2x mb-2"></i>
            <p class="small mb-0">การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่อีกครั้ง</p>
            <button class="btn btn-sm btn-outline-secondary mt-2" onclick="location.reload()">โหลดใหม่</button>
          </div>`;
      }, 12000);

      window.onCatalogLoaded = (res) => {
        clearTimeout(timeout);
        if (res && res.success) {
          catalog = res.data || [];
          initDrillDown();
        } else {
          document.getElementById('step1Container').innerHTML = '<p class="text-center text-danger py-4 small col-12">ไม่พบข้อมูลสินค้าในระบบ</p>';
        }
      };

      script.onerror = () => {
        clearTimeout(timeout);
        document.getElementById('step1Container').innerHTML = '<p class="text-danger small text-center col-12">ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้</p>';
      };
      
      document.body.appendChild(script);
    }

    function initDrillDown() {
      navigateToStep(1);
    }

    function navigateToStep(step, val = null) {
      currentStep = step;
      if (step === 2) selectedMainCategory = val;
      if (step === 3) selectedSubCategory = val;

      const step1El = document.getElementById('step1Container');
      const step2El = document.getElementById('step2Container');
      const step3El = document.getElementById('step3Container');
      const backBtnEl = document.getElementById('backBtnContainer');
      const titleEl = document.getElementById('stepTitle');

      step1El.style.display = (step === 1) ? 'flex' : 'none';
      step2El.style.display = (step === 2) ? 'flex' : 'none';
      step3El.style.display = (step === 3) ? 'block' : 'none';
      backBtnEl.style.display = (step === 1) ? 'none' : 'block';

      if (step === 1) {
        titleEl.innerHTML = '<i class="fa-solid fa-boxes-stacked me-2 text-warning"></i>2. เลือกหมวดหมู่หลัก';
        renderStep1();
      } else if (step === 2) {
        titleEl.innerHTML = `<i class="fa-solid fa-layer-group me-2 text-warning"></i>${selectedMainCategory}`;
        renderStep2();
      } else if (step === 3) {
        titleEl.innerHTML = `<i class="fa-solid fa-list-check me-2 text-warning"></i>${selectedSubCategory}`;
        renderStep3();
      }
    }

    function navigateBack() {
      if (currentStep === 3) {
        navigateToStep(2, selectedMainCategory);
      } else if (currentStep === 2) {
        navigateToStep(1);
      }
    }

    function renderStep1() {
      const mainCategories = [...new Set(catalog.map(item => item.category).filter(Boolean))];
      const container = document.getElementById('step1Container');

      if (mainCategories.length === 0) {
        container.innerHTML = '<p class="text-center text-muted py-4 small col-12">ไม่พบหมวดหมู่สินค้า</p>';
        return;
      }

      const categoryImages = {
        'Brass Fittings': 'https://www.ifan-solution.com/uploads/35186/ifan-all-type-brass-fittings0c8e5.webp',
        'Control Valves & Pneumatic Lines': '',
        'Pipe Fittings & Structural Hardware': ''
      };

      container.innerHTML = mainCategories.map(cat => {
        const imgSrc = categoryImages[cat] || '';
        const iconHtml = imgSrc 
          ? `<img src="${imgSrc}" alt="${cat}" class="img-fluid">`
          : `<i class="fa-solid fa-folder-open text-primary" style="font-size: 3.5rem;"></i>`;

        return `
          <div class="col-12">
            <div class="card drill-card h-100 rounded-4 text-center">
              <div class="drill-img-container" onclick="navigateToStep(2, '${cat}')">
                ${iconHtml}
              </div>
              <div class="p-3" onclick="navigateToStep(2, '${cat}')">
                <h6 class="fw-bold text-dark mb-0" style="font-size: 1rem;">${cat}</h6>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderStep2() {
      const itemsInMain = catalog.filter(item => item.category === selectedMainCategory);
      const subCategories = [...new Set(itemsInMain.map(item => item.subCategory).filter(Boolean))];
      const container = document.getElementById('step2Container');

      if (subCategories.length === 0) {
        container.innerHTML = '<p class="text-center text-muted py-4 small col-12">ไม่พบหมวดหมู่ย่อยในหมวดนี้</p>';
        return;
      }

      const subCategoryImages = {
        'Speed Control & Valves': '',
        'Pneumatic & Silicone Hoses': '',
        'Cylinders, F.R. Units & Sensors': ''
      };

      container.innerHTML = subCategories.map(subCat => {
        const imgSrc = subCategoryImages[subCat] || '';
        const iconHtml = imgSrc 
          ? `<img src="${imgSrc}" alt="${subCat}" class="img-fluid">`
          : `<i class="fa-solid fa-box-archive text-warning" style="font-size: 3.5rem;"></i>`;

        return `
          <div class="col-12">
            <div class="card drill-card h-100 rounded-4 text-center">
              <div class="drill-img-container" onclick="navigateToStep(3, '${subCat}')">
                ${iconHtml}
              </div>
              <div class="p-3" onclick="navigateToStep(3, '${subCat}')">
                <h6 class="fw-bold text-dark mb-0" style="font-size: 0.95rem;">${subCat}</h6>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderStep3() {
      const keyword = String(document.getElementById('searchInput').value || '').toLowerCase().trim();
      const listContainer = document.getElementById('productList');

      const filtered = catalog.filter(item => {
        const matchMain = item.category === selectedMainCategory;
        const matchSub = item.subCategory === selectedSubCategory;
        
        const nameStr = String(item.partName || '').toLowerCase();
        const idStr = String(item.partId || '').toLowerCase();
        const sizeStr = String(item.size || '').toLowerCase();
        const matchKey = nameStr.includes(keyword) || idStr.includes(keyword) || sizeStr.includes(keyword);

        return matchMain && matchSub && matchKey;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '<p class="text-center text-muted py-5 small col-12">ไม่พบรายการสินค้าที่ค้นหา</p>';
        return;
      }

      listContainer.innerHTML = filtered.map(item => {
        const qty = cart[item.partId] || 0;
        const stockVal = Number(item.stock) || 0;
        const currentStock = stockVal - qty;
        const isOut = currentStock <= 0;

        return `
          <div class="col-12">
            <div class="card card-product h-100 rounded-4 p-3 d-flex flex-column justify-content-between bg-white shadow-sm">
              <div>
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <span class="badge bg-light text-dark font-monospace px-2 py-1 rounded-pill" style="font-size: 0.75rem;">${item.partId}</span>
                  <span id="stock-badge-${item.partId}" class="badge ${currentStock > 0 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'} rounded-pill px-2" style="font-size: 0.7rem;">คลัง: ${currentStock}</span>
                </div>
                <h6 class="fw-bold text-dark mb-1" style="font-size: 0.95rem;">${item.partName}</h6>
                <p class="text-muted mb-1" style="font-size: 0.8rem;">ขนาด: <span class="text-secondary fw-medium">${item.size || '-'}</span></p>
                <div class="text-muted mb-3" style="font-size: 0.75rem;"><i class="fa-solid fa-location-dot me-1 text-danger"></i>${item.location || '-'}</div>
              </div>
              <div>
                <div class="d-flex align-items-center justify-content-between bg-light rounded-pill p-1 border">
                  <button type="button" class="btn btn-sm btn-white rounded-circle shadow-sm fw-bold text-dark d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;" onclick="updateCart('${item.partId}', -1, ${stockVal})">
                    <i class="fa-solid fa-minus fa-xs"></i>
                  </button>
                  <span class="cart-qty fw-bold text-navy px-2" id="qty-${item.partId}" style="font-size: 1rem;">${qty}</span>
                  <button type="button" id="btn-plus-${item.partId}" class="btn btn-sm rounded-circle shadow-sm fw-bold d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; background-color: var(--gold); color: #000;" ${isOut ? 'disabled' : ''} onclick="updateCart('${item.partId}', 1, ${stockVal})">
                    <i class="fa-solid fa-plus fa-xs"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateCart(partId, change, maxStock) {
      const current = cart[partId] || 0;
      const next = current + change;

      if (next < 0) return;
      if (next > maxStock) {
        Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'จำนวนเบิกเกินจำนวนคงเหลือในคลัง', confirmButtonColor: '#1D2088' });
        return;
      }

      if (next === 0) { delete cart[partId]; } else { cart[partId] = next; }

      const qtyEl = document.getElementById(`qty-${partId}`);
      if (qtyEl) qtyEl.innerText = next;

      const remainingStock = maxStock - next;
      const stockBadge = document.getElementById(`stock-badge-${partId}`);
      const plusBtn = document.getElementById(`btn-plus-${partId}`);
      
      if (stockBadge) {
        stockBadge.innerText = `คลัง: ${remainingStock}`;
        stockBadge.className = `badge ${remainingStock > 0 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'} rounded-pill px-2`;
      }
      if (plusBtn) { plusBtn.disabled = remainingStock <= 0; }
    }

    function validatePage1() {
      const name = document.getElementById('userName').value.trim();
      const dept = document.getElementById('dept').value;
      const purpose = document.getElementById('purpose').value;
      const project = document.getElementById('project').value.trim();

      if (!name || !dept || !purpose || !project) {
        Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกข้อมูลผู้เบิกให้ครบถ้วน', confirmButtonColor: '#1D2088' });
        return;
      }
      goToPage(2);
    }

    function validatePage2() {
      const totalSelected = Object.keys(cart).reduce((sum, key) => sum + cart[key], 0);
      if (totalSelected === 0) {
        Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณาเลือกรายการสินค้าอย่างน้อย 1 ชิ้น', confirmButtonColor: '#1D2088' });
        return;
      }
      goToPage(3);
      renderSummary();
    }

    function goToPage(pageNumber) {
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      let targetPage = document.getElementById('page' + pageNumber);
      if (targetPage) {
        targetPage.classList.add('active');
      } else {
        // หากต้องการรองรับหน้า 3 และ 4 สามารถเพิ่มโครงสร้าง HTML ของหน้าสรุปและใบเบิกเพิ่มเติมได้ครับ
      }
      window.scrollTo(0, 0);
    }
  </script>
